<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repair RSV</title>
  </head>
  <body>
    <section id="enginePanel" class="engine-screen" role="status" aria-live="polite" aria-busy="true">
      <div class="engine-content">
        <span id="engineSpinner" class="engine-spinner" aria-hidden="true"></span>
        <p id="engineMessage">正在准备引擎…</p>
        <button id="engineRetry" class="secondary" type="button" hidden data-i18n="engineRetry">重试</button>
      </div>
    </section>
    <main id="mainPage" class="shell" hidden>
      <section class="hero">
        <div>
          <p class="eyebrow" data-i18n="eyebrow">SONY RSV 视频修复</p>
          <h1>Repair RSV</h1>
        </div>
        <div class="hero-controls">
          <label class="language-control"><span data-i18n="language">语言</span>
            <select id="languageSelect" aria-label="语言"><option value="zh-CN">简体中文</option><option value="en">English</option></select>
          </label>
          <div id="statePill" class="state-pill">正在准备</div>
        </div>
      </section>

      <section id="inputGrid" class="drop-grid" aria-label="修复文件选择">
        <section class="input-card">
        <button id="brokenDrop" class="drop-zone" type="button" disabled>
          <span class="label" data-i18n="broken">待修复 RSV</span>
          <span id="brokenIcon" class="drop-icon" aria-hidden="true">
            <svg class="icon icon-plus" viewBox="0 0 64 64" focusable="false">
              <path d="M32 4a28 28 0 1 0 0 56 28 28 0 0 0 0-56Zm0 5a23 23 0 1 1 0 46 23 23 0 0 1 0-46Zm2.5 10.5h-5v10h-10v5h10v10h5v-10h10v-5h-10v-10Z" />
            </svg>
            <svg class="icon icon-document" viewBox="0 0 64 64" focusable="false">
              <path d="M16 6h22l14 14v34a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4Zm21 4v11h11L37 10Z" />
            </svg>
          </span>
          <span id="brokenPath" class="path">拖入 .RSV 文件，或点击选择</span>
        </button>
          <div id="brokenInfo" class="media-info" aria-live="polite"></div>
        </section>
        <section class="input-card">
        <button id="donorDrop" class="drop-zone" type="button" disabled>
          <span class="label" data-i18n="donor">参照视频</span>
          <span id="donorIcon" class="drop-icon" aria-hidden="true">
            <svg class="icon icon-plus" viewBox="0 0 64 64" focusable="false">
              <path d="M32 4a28 28 0 1 0 0 56 28 28 0 0 0 0-56Zm0 5a23 23 0 1 1 0 46 23 23 0 0 1 0-46Zm2.5 10.5h-5v10h-10v5h10v10h5v-10h10v-5h-10v-10Z" />
            </svg>
            <svg class="icon icon-document" viewBox="0 0 64 64" focusable="false">
              <path d="M16 6h22l14 14v34a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4Zm21 4v11h11L37 10Z" />
            </svg>
          </span>
          <span id="donorPath" class="path">拖入同模式参照视频，或点击选择</span>
        </button>
          <div id="donorInfo" class="media-info" aria-live="polite"></div>
        </section>
      </section>

      <section class="status-panel" aria-live="polite">
        <div class="progress-row">
          <div id="progressTrack" class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="progressFill" class="progress-fill"></div>
          </div>
          <span id="progressText" class="progress-text">0%</span>
        </div>
        <div id="resultGrid" class="result-grid" hidden>
          <div class="result-status">
            <p id="statusText" class="status-text"></p>
            <p id="outputPath" class="output-path"></p>
          </div>
          <section id="outputSummary" class="result-info" hidden>
            <h2 data-i18n="resultTitle">修复文件信息</h2>
            <div id="outputInfo" aria-live="polite"></div>
          </section>
        </div>
      </section>

      <section class="actions">
        <button id="repairButton" class="primary" type="button" disabled data-i18n="repair">开始修复</button>
        <button id="cancelButton" class="secondary" type="button" disabled data-i18n="cancel">取消修复</button>
        <button id="revealButton" class="secondary" type="button" disabled data-i18n="reveal">显示输出文件</button>
      </section>
      <details id="logPanel" class="log-panel" hidden><summary data-i18n="logs">运行日志</summary><pre id="logText"></pre></details>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
