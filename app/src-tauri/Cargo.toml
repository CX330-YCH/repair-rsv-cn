[package]
name = "repair-rsv"
version = "0.1.6"
description = "One-click Sony RSV repair app"
authors = ["Repair RSV"]
edition = "2021"

[lib]
name = "repair_rsv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }
flate2 = "=1.1.9"
sha2 = "=0.10.9"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "=1.1.9"
sha2 = "=0.10.9"
tauri = { version = "=2.10.3", features = [] }
tauri-plugin-dialog = "=2.7.0"
